<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>공과강사</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>📖 공과강사</h1>
    <nav class="nav" role="tablist">
      <button class="nav-btn active" data-view="mine">내 공과</button>
      <button class="nav-btn" data-view="table">배정표</button>
      <button class="nav-btn" data-view="edit">배정표 입력</button>
    </nav>
    <div class="spacer"></div>
    <div class="account" id="account">
      <button class="btn small" id="loginBtn">깨사모 로그인</button>
    </div>
  </header>

  <main class="main">
    <!-- 내 공과 -->
    <section data-section="mine">
      <div class="who" id="whoBox">
        <label for="meSelect">내 이름</label>
        <select id="meSelect"><option value="">선택하세요</option></select>
      </div>
      <p class="hint" id="whoHint"></p>
      <div id="mineBody"></div>
    </section>

    <!-- 배정표 -->
    <section data-section="table" class="hidden">
      <div class="month-bar">
        <button class="btn" id="prevMonth" aria-label="이전 달">◀</button>
        <h2 id="monthTitle"></h2>
        <button class="btn" id="nextMonth" aria-label="다음 달">▶</button>
      </div>
      <div id="tableBody"></div>
    </section>

    <!-- 배정표 입력 -->
    <section data-section="edit" class="hidden">
      <div class="card">
        <div class="row">
          <label class="field">월
            <input type="month" id="editMonth" />
          </label>
          <label class="field grow">교회
            <input id="editChurch" value="일산교회" />
          </label>
        </div>
        <p class="hint">담당자는 배정표처럼 <b>이름+표시</b>로 적으세요 (예: <code>유석준B</code>). 공과 제목이 같은 칸은 자료 링크를 함께 씁니다.</p>
      </div>
      <div id="editBody"></div>
      <div class="actions">
        <span class="msg" id="editMsg"></span>
        <div class="spacer"></div>
        <button class="btn" id="addWeek">＋ 주 추가</button>
        <button class="btn primary" id="saveSchedule">저장</button>
      </div>
    </section>
  </main>

  <!-- 공과 자료 -->
  <dialog id="resDialog">
    <form method="dialog" class="dialog-head">
      <h2 id="resTitle"></h2>
      <button class="icon-btn" aria-label="닫기">✕</button>
    </form>
    <div id="resAuto" class="res-auto"></div>
    <p class="hint">전국교회학교 연간공과 일정에서 자동으로 찾은 자료입니다. 추가로 저장할 링크나 메모가 있으면 아래에 적으세요 (모든 강사가 함께 봅니다).</p>
    <label class="field">추가 자료 이름 (선택)
      <input id="resTextbook" />
    </label>
    <label class="field">추가 자료 링크
      <input id="resTextbookUrl" type="url" placeholder="https://" />
    </label>
    <label class="field">추가 영상 링크
      <input id="resYoutube" type="url" placeholder="https://youtu.be/..." />
    </label>
    <label class="field">메모 (본문 구절, 준비물 등)
      <textarea id="resNote" rows="3"></textarea>
    </label>
    <div class="actions">
      <span class="msg" id="resMsg"></span>
      <div class="spacer"></div>
      <button class="btn primary" id="resSave">저장</button>
    </div>
  </dialog>

  <!-- 깨사모 로그인 -->
  <dialog id="loginDialog">
    <form class="dialog-head" method="dialog">
      <h2>깨사모 로그인</h2>
      <button class="icon-btn" aria-label="닫기">✕</button>
    </form>
    <form id="loginForm">
      <label class="field">깨사모 아이디
        <input id="loginId" autocomplete="username" autocapitalize="off" required />
      </label>
      <label class="field">비밀번호
        <input id="loginPw" type="password" autocomplete="current-password" required />
      </label>
      <p class="hint">로그인하면 배정표에서 내 공과를 자동으로 찾아 줍니다. 한 번 로그인하면 이 기기에서 계속 로그인 상태가 유지됩니다. 비밀번호는 저장하지 않습니다.</p>
      <div class="actions">
        <span class="msg" id="loginMsg"></span>
        <div class="spacer"></div>
        <button class="btn primary" id="loginSubmit">로그인</button>
      </div>
    </form>
  </dialog>

  <!-- 자료 보기 (PDF / 영상 / 음성) -->
  <dialog id="viewer" class="viewer">
    <div class="dialog-head">
      <h2 id="viewerTitle"></h2>
      <div class="viewer-actions">
        <button class="btn small" id="viewerDownload">⬇ 다운로드</button>
        <form method="dialog"><button class="icon-btn" aria-label="닫기">✕</button></form>
      </div>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
