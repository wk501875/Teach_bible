<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5fc" />
  <title>일산교회 공과강사</title>
  <meta name="description" content="내 공과 배정 · 머릿돌 · 참빛 교재 · 공과 말씀 영상을 한 곳에서" />
  <!-- 카카오톡·문자 공유 미리보기 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="일산교회 공과강사" />
  <meta property="og:title" content="일산교회 공과강사" />
  <meta property="og:description" content="내 공과 배정 · 머릿돌 · 참빛 교재 · 공과 말씀 영상을 한 곳에서" />
  <meta property="og:url" content="https://teach-bible.ilsan-school.workers.dev/" />
  <meta property="og:image" content="https://teach-bible.ilsan-school.workers.dev/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://teach-bible.ilsan-school.workers.dev/og.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="공과강사" />
</head>
<body>
  <header class="brand-bar">
    <img src="/logo.svg" alt="" class="brand-logo" width="36" height="36" />
    <span class="brand-name">공과강사<small id="brandChurch">일산교회</small></span>
  </header>

  <!-- 오늘 (내 공과) -->
  <section class="page" data-section="mine">
    <div class="page-head">
      <div class="titles">
        <p class="eyebrow" id="mineEyebrow"></p>
        <h1 id="mineTitle">내 공과</h1>
        <p class="sub" id="mineSub"></p>
      </div>
      <button class="avatar-btn" id="avatarBtn" aria-label="설정"></button>
    </div>
    <div id="mineBody"></div>
  </section>

  <!-- 배정표 -->
  <section class="page hidden" data-section="table">
    <div class="page-head">
      <div class="titles">
        <p class="eyebrow" id="tableEyebrow"></p>
        <h1>배정표</h1>
        <p class="sub" id="tableSub"></p>
      </div>
      <div class="month-nav">
        <button class="round" id="prevMonth" aria-label="이전 달" data-icon="chevronLeft"></button>
        <button class="round" id="nextMonth" aria-label="다음 달" data-icon="chevronRight"></button>
      </div>
    </div>
    <div class="chips scroll" id="deptChips"></div>
    <div id="tableBody"></div>
  </section>

  <!-- 배정표 입력 -->
  <section class="page hidden" data-section="edit">
    <div class="page-head">
      <div class="titles">
        <h1>배정표 입력</h1>
        <p class="sub">매달 받은 배정표를 입력합니다</p>
      </div>
    </div>
    <div class="stats" id="editStats"></div>
    <div class="card card-pad">
      <div class="row">
        <label class="field">월
          <input type="month" id="editMonth" />
        </label>
        <label class="field grow">교회
          <input id="editChurch" value="일산교회" />
        </label>
      </div>
      <p class="hint">담당자는 배정표 표기 그대로 적습니다 (예: 유석준B). 집회·행사 주는 일정 이름을 적으면 됩니다.</p>
    </div>
    <div id="editBody"></div>
    <div class="save-bar">
      <span class="msg" id="editMsg"></span>
      <button class="btn small" id="addWeek">주 추가</button>
      <button class="btn dark small" id="saveSchedule">저장</button>
    </div>
  </section>

  <!-- 설정 -->
  <section class="page hidden" data-section="settings">
    <div class="page-head">
      <div class="titles">
        <h1>설정</h1>
      </div>
    </div>
    <div class="card" id="profileCard"></div>
    <div id="settingsRows"></div>
    <p class="foot-note">공과 자료 출처: 전국교회학교 연간공과 일정</p>
  </section>

  <!-- 하단 탭바 -->
  <nav class="tabbar" role="tablist">
    <button class="nav-btn active" data-view="mine"><span data-icon="home"></span>내 공과</button>
    <button class="nav-btn" data-view="table"><span data-icon="grid"></span>배정표</button>
    <button class="nav-btn" data-view="edit"><span data-icon="edit"></span>입력</button>
    <button class="nav-btn" data-view="settings"><span data-icon="settings"></span>설정</button>
  </nav>

  <!-- 공과 자료 · 메모 -->
  <dialog id="resDialog" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title"><h2 id="resTitle"></h2><p id="resSub"></p></div>
      <form method="dialog"><button class="close-btn" aria-label="닫기" data-icon="close"></button></form>
    </div>
    <div class="sheet-body">
      <div id="resAuto"></div>
      <p class="section-label">메모 · 추가 자료</p>
      <label class="field">추가 자료 이름
        <input id="resTextbook" />
      </label>
      <label class="field">추가 자료 링크
        <input id="resTextbookUrl" type="url" placeholder="https://" />
      </label>
      <label class="field">추가 영상 링크
        <input id="resYoutube" type="url" placeholder="https://youtu.be/..." />
      </label>
      <label class="field">메모
        <textarea id="resNote" rows="3"></textarea>
      </label>
      <div class="actions">
        <span class="msg" id="resMsg"></span>
        <div class="spacer"></div>
        <button class="btn dark" id="resSave">저장</button>
      </div>
    </div>
  </dialog>

  <!-- 깨사모 로그인 -->
  <dialog id="loginDialog" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title"><h2>깨사모 로그인</h2></div>
      <form method="dialog"><button class="close-btn" aria-label="닫기" data-icon="close"></button></form>
    </div>
    <form id="loginForm" class="sheet-body">
      <label class="field">깨사모 아이디
        <input id="loginId" autocomplete="username" autocapitalize="off" required />
      </label>
      <label class="field">비밀번호
        <input id="loginPw" type="password" autocomplete="current-password" required />
      </label>
      <p class="hint">이 기기에서 로그인이 유지됩니다. 비밀번호는 저장하지 않습니다.</p>
      <button class="btn dark block" id="loginSubmit">로그인</button>
      <p class="msg center" id="loginMsg"></p>
    </form>
  </dialog>

  <!-- 자료 보기 -->
  <dialog id="viewer" class="sheet viewer">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title"><h2 id="viewerTitle"></h2><p id="viewerSub"></p></div>
      <button class="btn small" id="viewerDownload">다운로드</button>
      <form method="dialog"><button class="close-btn" aria-label="닫기" data-icon="close"></button></form>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
